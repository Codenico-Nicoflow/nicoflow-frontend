image: node:20-alpine

stages:
  - install
  - test
  - build
  - deploy-staging
  - deploy-production

# ============================================================================
# Install Stage
# ============================================================================
install:
  stage: install
  script:
    - corepack enable
    - pnpm install --frozen-lockfile
  artifacts:
    paths:
      - node_modules
    expire_in: 2 hour

# ============================================================================
# Test Stage
# ============================================================================
lint:
  stage: test
  dependencies:
    - install
  before_script:
    - corepack enable
  script:
    - pnpm lint
  only:
    changes:
      - '**/*.{js,jsx,ts,tsx}'
      - '.eslintrc*'
      - 'eslint.config.js'
      - '.gitlab-ci.yml'

type_check:
  stage: test
  dependencies:
    - install
  before_script:
    - corepack enable
  script:
    - pnpm type-check
  only:
    changes:
      - '**/*.{ts,tsx}'
      - 'tsconfig*.json'

test:
  stage: test
  dependencies:
    - install
  before_script:
    - corepack enable
  script:
    - pnpm test:coverage
  coverage: '/All files\s+\|\s+\d+\.\d+%/'
  artifacts:
    paths:
      - coverage/
    expire_in: 30 days
  only:
    changes:
      - 'src/**/*'
      - '__tests__/**/*'
      - 'vite.config.ts'
      - '.gitlab-ci.yml'

# ============================================================================
# Build Stage
# ============================================================================
build:
  stage: build
  dependencies:
    - install
    - test
  before_script:
    - corepack enable
  script:
    - pnpm build
  artifacts:
    paths:
      - dist
    expire_in: 1 week
  only:
    changes:
      - 'src/**/*'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'

# ============================================================================
# Deploy Staging Stage
# ============================================================================
deploy:staging:
  stage: deploy-staging
  image: node:20-alpine
  dependencies:
    - build
  before_script:
    - npm install -g vercel@latest
  script:
    - vercel deploy ./dist --prod --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID --project=$VERCEL_PROJECT_ID_STAGING
  environment:
    name: staging
    url: https://nicoflow-staging-codenico05s-projects.vercel.app
  only:
    refs:
      - staging

# ============================================================================
# Deploy Production Stage
# ============================================================================
deploy:production:
  stage: deploy-production
  image: node:20-alpine
  dependencies:
    - build
  before_script:
    - npm install -g vercel@latest
  script:
    - vercel deploy ./dist --prod --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID --project=$VERCEL_PROJECT_ID_PRODUCTION
  environment:
    name: production
    url: https://nicoflow-production.vercel.app
  only:
    refs:
      - production
  when: manual
  allow_failure: false
